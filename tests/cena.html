<!doctype html><meta charset="utf-8"><title>cena</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}iframe{border:0;display:block}</style>
<body><script>
// Captura de tela: ?p=pt|en&f=<id da secao>. Carrega a pagina real, rola ate a secao e espera estabilizar.
var q = new URLSearchParams(location.search), f = document.createElement('iframe');
function medida(v, padrao) { return v ? (/^[0-9]+$/.test(v) ? v + 'px' : v) : padrao; }
f.style.width = medida(q.get('w'), '100vw'); f.style.height = medida(q.get('h'), '100vh');
f.src = (q.get('p') === 'en' ? '../en/index.html' : '../index.html'); document.body.appendChild(f);
f.onload = function () {
  var w = f.contentWindow, d = f.contentDocument; d.documentElement.style.scrollBehavior = 'auto';
  setTimeout(function () {
    var s = d.getElementById(q.get('f') || 'inicio'); if (s) w.scrollTo(0, s.getBoundingClientRect().top + w.scrollY - 60);
    setTimeout(function () { [].forEach.call(d.querySelectorAll('.digita'), function (e) { e.style.animation = 'none'; }); }, 1500);
  }, 800);
};
</script>
