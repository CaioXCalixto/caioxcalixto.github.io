<!doctype html><meta charset="utf-8"><title>gera-avatar</title>
<body style="margin:0;background:#2a3a6a"><canvas id="prev"></canvas>
<script>
// Ferramenta: le _fonte/avatar-original.png, remove o fundo (flood fill), reduz para a grade de pixels e
// agrupa as cores. Imprime RESULTADO: OK {rows, paleta} para colar em jogo/sprites.js.
var CEL = 18.5, TOL_FUNDO = 12, TOL_COR = 40, CHAVES = '0123456789ABCEFGIJKMNOPQRTUWXYZ';
var img = new Image();
img.onload = function () {
  var W = img.width, H = img.height, c = document.createElement('canvas'); c.width = W; c.height = H;
  var g = c.getContext('2d'); g.drawImage(img, 0, 0); var d = g.getImageData(0, 0, W, H).data;
  var bg = [d[0], d[1], d[2]];
  function dist(i, p) { return Math.abs(d[i] - p[0]) + Math.abs(d[i + 1] - p[1]) + Math.abs(d[i + 2] - p[2]); }
  var fora = new Uint8Array(W * H), pilha = [];
  function tenta(x, y) { var k = y * W + x; if (x < 0 || y < 0 || x >= W || y >= H || fora[k]) return; if (dist(k * 4, bg) <= TOL_FUNDO) { fora[k] = 1; pilha.push(k); } }
  for (var x = 0; x < W; x++) { tenta(x, 0); tenta(x, H - 1); } for (var y = 0; y < H; y++) { tenta(0, y); tenta(W - 1, y); }
  while (pilha.length) { var k = pilha.pop(), px = k % W, py = (k / W) | 0; tenta(px + 1, py); tenta(px - 1, py); tenta(px, py + 1); tenta(px, py - 1); }
  var x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (!fora[y * W + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  var bw = x1 - x0 + 1, bh = y1 - y0 + 1, nW = Math.round(bw / CEL), nH = Math.round(bh / CEL), cw = bw / nW, ch = bh / nH;
  var cel = [];
  for (var r = 0; r < nH; r++) { cel.push([]); for (var q = 0; q < nW; q++) {
    var sx = x0 + q * cw + cw * 0.2, ex = x0 + (q + 1) * cw - cw * 0.2, sy = y0 + r * ch + ch * 0.2, ey = y0 + (r + 1) * ch - ch * 0.2, n = 0, nf = 0, R = 0, G = 0, B = 0;
    for (var yy = Math.floor(sy); yy <= ey; yy++) for (var xx = Math.floor(sx); xx <= ex; xx++) { var kk = yy * W + xx; n++; if (fora[kk]) nf++; else { R += d[kk * 4]; G += d[kk * 4 + 1]; B += d[kk * 4 + 2]; } }
    cel[r].push(nf * 2 > n ? null : [Math.round(R / (n - nf)), Math.round(G / (n - nf)), Math.round(B / (n - nf))]);
  } }
  // agrupa cores: gulosamente, por frequencia
  var cont = {}; cel.forEach(function (l) { l.forEach(function (c2) { if (c2) { var h = c2.join(','); cont[h] = (cont[h] || 0) + 1; } }); });
  var ordem = Object.keys(cont).sort(function (a, b) { return cont[b] - cont[a]; }), pal = [];
  function d3(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]); }
  ordem.forEach(function (h) { var c3 = h.split(',').map(Number), m = null; pal.forEach(function (p) { if (d3(p.c, c3) <= TOL_COR && (!m || d3(p.c, c3) < d3(m.c, c3))) m = p; }); if (!m) pal.push({ c: c3, n: cont[h] }); });
  function hex(c4) { return '#' + c4.map(function (v) { return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
  var paleta = {}, rows = [];
  pal.forEach(function (p, i) { p.k = CHAVES[i]; paleta[p.k] = hex(p.c); });
  cel.forEach(function (l) { rows.push(l.map(function (c5) { if (!c5) return '.'; var m = null; pal.forEach(function (p) { if (!m || d3(p.c, c5) < d3(m.c, c5)) m = p; }); return m.k; }).join('')); });
  // previa ampliada
  var pv = document.getElementById('prev'), S = 12; pv.width = nW * S; pv.height = nH * S; var pg = pv.getContext('2d');
  rows.forEach(function (l, i) { l.split('').forEach(function (ch2, j) { if (ch2 !== '.') { pg.fillStyle = paleta[ch2]; pg.fillRect(j * S, i * S, S, S); } }); });
  var r2 = 'RESULTADO: OK ' + JSON.stringify({ nW: nW, nH: nH, cores: pal.length, paleta: paleta, rows: rows });
  document.title = 'avatar ' + nW + 'x' + nH; console.log(r2);
};
img.onerror = function () { console.log('RESULTADO: FALHA imagem'); };
img.src = '../_fonte/avatar-original.png';
</script>
